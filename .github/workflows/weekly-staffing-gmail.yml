name: Weekly Staffing Email (Gmail)

on:
  schedule:
    # GitHub Actions cron is UTC. This runs Mondays at 13:00 UTC.
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

jobs:
  send-staffing-email:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests supabase

      - name: Send weekly staffing email
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
        run: |
          python -m tools.weekly_staffing_email_gmail
